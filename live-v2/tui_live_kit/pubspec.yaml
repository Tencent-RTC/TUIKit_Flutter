name: tencent_live_uikit
description: "Tencent Cloud TUILiveKit is a live streaming UI component library (Flutter). It provides three entry points: LiveListView, PlayerView, and PusherView."
version: 5.3.0
homepage: https://trtc.io
repository: https://github.com/Tencent-RTC/TUILiveKit

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  atomic_x_core: ^5.3.0
  tencent_cloud_chat_sdk: ^9.0.7652
  permission_handler: ^11.3.1
  svgaplayer_flutter: ^2.2.0
  flutter_effect_player: ^3.4.1
  path_provider: ^2.1.3
  crypto: ^3.0.3
  stack_trace: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/
    - assets/2.0x/
    - assets/3.0x/

  plugin:
    platforms:
      android:
        package: com.tencent.livekit.tui_live_kit
        pluginClass: TUILiveKitPlugin
      ios:
        pluginClass: TUILiveKitPlugin
