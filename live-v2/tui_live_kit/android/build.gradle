// `plugins {}` 必须是脚本的第一个语句，group 与 version 放在其后。
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group = "com.tencent.livekit.tui_live_kit"
version = "1.0"

android {
    namespace = "com.tencent.livekit.tui_live_kit"

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        // 与 atomic_x_core 保持一致；系统热状态需要 API 29，低版本在插件内退化处理。
        minSdk = 21
        consumerProguardFiles "consumer-rules.pro"
    }
}

dependencies {
    // TencentEffect also supplies the authorization library used by MP4 gifts.
    implementation 'com.tencent.mediacloud:TEBeautyKit:4.1.0.14'
    implementation 'com.tencent.mediacloud:TencentEffect_S1-07:4.1.0.13'
    implementation 'com.tencent.liteav:LiteAVSDK_Professional:13.5.+'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    // 前台服务通知与权限校验。
    implementation "androidx.core:core-ktx:1.12.0"
}
