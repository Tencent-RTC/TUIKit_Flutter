name: app_uikit
description: Five-tab Atomic UIKit application for Android and iOS.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  atomic_x_core: 5.3.0
  crypto: ^3.0.3
  shared_preferences: ^2.5.0
  intl: any
  tencent_live_uikit:
    path: ../live/tui_live_kit
  tencent_chat_uikit:
    path: ../chat/uikit
  flutter_effect_player: ^3.4.1
dependency_overrides:
  # SVGA uses the compatible Client/get API; Chat requires the http 1.x line.
  http: ^1.2.0
  atomic_x_core: 5.3.0
  tencent_cloud_chat_sdk: 9.1.7822
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
EffectPlayer:
  sub_spec: NoXMagic
