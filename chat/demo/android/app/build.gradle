plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.hihonor.mcs.asplugin'
apply plugin: 'com.huawei.agconnect'

android {
    namespace = "com.tencent.uikit_next"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.tencent.qcloud.tim.tuikit"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 33
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
                "VIVO_APPID" : "",
                "VIVO_APPKEY": "",
                "HONOR_APPID": "",
        ]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            // 显式开启混淆（Flutter Gradle 插件 release 默认也会开启，构建时传 --no-shrink 除外）
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // release 只打 arm64-v8a（同时过滤插件 AAR 中的 LiteAV / IMSDK / AtomicEngine 等 so）
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        debug {
            // AtomicEngine 只提供 armeabi-v7a / arm64-v8a，无法提供 x86_64 模拟器 ABI
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    // so 在 APK 内 deflate 压缩存储（extractNativeLibs=true），减小 APK 下载体积
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.tencent.timpush:huawei:9.0.7652'
    implementation 'com.tencent.timpush:xiaomi:9.0.7652'
    implementation 'com.tencent.timpush:oppo:9.0.7652'
    implementation 'com.tencent.timpush:vivo:9.0.7652'
    implementation 'com.tencent.timpush:honor:9.0.7652'
    implementation 'com.tencent.timpush:meizu:9.0.7652'
    implementation 'com.tencent.timpush:fcm:9.0.7652'
}
