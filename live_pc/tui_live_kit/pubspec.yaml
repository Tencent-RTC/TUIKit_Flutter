name: tencent_live_kit_desktop
description: "TUILiveKit Flutter PC 直播组件库。"
version: 5.3.0
homepage: https://trtc.io

environment:
  # CI 流水线最低支持 Flutter 3.38（Dart 3.10），插件 SwiftPM 采用通用老格式以兼容该版本。
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  remixicon: ^4.9.3
  flutter_localizations:
    sdk: flutter
  characters: ^1.4.1
  intl: any
  file_selector: ^1.0.0
  # 本地快照持久化（场景/画面源/布局/美颜），按 userID 分 key 存储。
  shared_preferences: ^2.3.2
  atomic_x_core: ^5.3.3

  # 合图（本地媒体混流）：桌面专属能力，Dart 接口与原生库都在独立包内。
  # 本 UI 包是桌面直播 UI，直接使用 MediaMixingStore / MediaMixingCanvas，
  # 故显式依赖它；移动端 UI 包不依赖，编译期就看不到合图接口。
  atomic_x_core_media_mixing: ^5.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 6.x 要求 Dart ^3.8.0，与 Flutter 3.29（Dart 3.7）不兼容，降级到 5.x。
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/2.0x/
    - assets/3.0x/
  plugin:
    platforms:
      macos:
        pluginClass: TuiLiveKitPlugin
